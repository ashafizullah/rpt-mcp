name: Set up SAP Crystal Reports runtime
description: >
  Installs the SAP Crystal Reports runtime for .NET Framework (x64). SAP's download requires an interactive
  login, so the MSI is taken from a release of a PRIVATE repository you control (it is never published).
  If repo/token are not configured (e.g. pull requests from forks) the step reports installed=false instead of failing.

inputs:
  repo:
    description: Private repository (owner/name) whose latest release has the 64-bit runtime MSI (name containing "64") as an asset.
    required: false
  token:
    description: Token with read access to that repository.
    required: false

outputs:
  installed:
    description: "'true' when the runtime is installed."
    value: ${{ steps.install.outputs.installed }}

runs:
  using: composite
  steps:
    - id: install
      shell: pwsh
      env:
        GH_TOKEN: ${{ inputs.token }}
        CR_REPO: ${{ inputs.repo }}
      run: |
        if (-not $env:CR_REPO -or -not $env:GH_TOKEN) {
          Write-Output "::warning::Crystal Reports runtime not configured (variable CR_RUNTIME_REPO / secret CR_RUNTIME_TOKEN); build and tests are skipped."
          "installed=false" >> $env:GITHUB_OUTPUT
          exit 0
        }
        $dir = Join-Path $env:RUNNER_TEMP "crruntime"
        New-Item -ItemType Directory -Force $dir | Out-Null
        # SAP names the file e.g. CR13SP36MSI64_0-80007712.MSI; the pattern is case-sensitive, so filter afterwards.
        gh release download --repo $env:CR_REPO --pattern "*64*" --dir $dir --clobber
        if ($LASTEXITCODE -ne 0) { throw "Could not download the runtime MSI from $env:CR_REPO" }
        $msi = Get-ChildItem $dir | Where-Object { $_.Extension -ieq ".msi" } | Select-Object -First 1
        if (-not $msi) { throw "No 64-bit .msi asset in the latest release of $env:CR_REPO" }
        Write-Output "Installing $($msi.Name)"
        $p = Start-Process msiexec.exe -ArgumentList "/i `"$($msi.FullName)`" /qn /norestart /l*v `"$dir\install.log`"" -Wait -PassThru
        if ($p.ExitCode -notin 0, 3010) { Get-Content "$dir\install.log" -Tail 60; throw "msiexec exited with $($p.ExitCode)" }
        # Older SPs install into the legacy GAC, newer ones into the .NET 4 GAC (folders named v4.0_<version>__<token>).
        $roots = @((Join-Path $env:WINDIR "assembly\GAC_MSIL"), (Join-Path $env:WINDIR "Microsoft.NET\assembly\GAC_MSIL"))
        $found = $false
        foreach ($root in $roots) {
          $engine = Join-Path $root "CrystalDecisions.CrystalReports.Engine"
          if (Test-Path $engine) {
            $found = $true
            Get-ChildItem $engine | ForEach-Object { Write-Output "Engine assembly: $root\...\$($_.Name)" }
          }
        }
        if (-not $found) {
          Get-ChildItem -Path $roots -Filter "CrystalDecisions*" -ErrorAction SilentlyContinue | Select-Object -First 20 | ForEach-Object { Write-Output $_.FullName }
          throw "Crystal runtime assemblies not found in either GAC after install"
        }
        "installed=true" >> $env:GITHUB_OUTPUT
